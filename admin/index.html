<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — DelphiAI Showroom</title>
    <!-- General Sans Font -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
    
    <!-- Main shared styles from user flow -->
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Admin-specific overrides -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- Unified Header from User Flow -->
    <header class="universal-header">
        <div class="header-brand-bar">
            <div class="logo">
                <img src="../assets/Delphi x AI.png" alt="Delphi x AI" style="max-height: 24px;">
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                </button>
                <div class="user-profile-container">
                    <button class="icon-btn user-profile-btn" title="User Menu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="header-subnav">
            <button class="back-nav-btn" onclick="window.location.href='../index.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                <span>Exit Admin</span>
            </button>
            <nav class="breadcrumbs" id="header-breadcrumb">
                <!-- Breadcrumbs injected here by JS -->
            </nav>
        </div>
    </header>

    <div class="practices-layout" style="margin-top: 0; min-height: calc(100vh - 120px);">
        <!-- Sidebar using the practices-sidebar styling -->
        <aside class="practices-sidebar" style="height: auto; border-right: 1px solid rgba(255,255,255,0.1);">
            <h3 class="sidebar-title" style="margin-top: 20px;">ADMINISTRATION<br><span>Showroom</span></h3>
            <ul class="sidebar-nav" id="sidebar-nav">
                <!-- Links will be injected by admin.js -->
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="practices-main-content" id="admin-content" style="padding-top: 20px;">
            <!-- Views rendered here by admin.js -->
        </div>
    </div>

    <!-- Global Modals Container -->
    <div id="modal-container"></div>

    <!-- Admin Application Logic -->
    <script src="js/admin.js"></script>
</body>
</html>
